# Run the images built by .github/workflows/docker.yml instead of building on the server.
# Use it through `make up-prebuilt`.
services:
  router:
    image: ${FRW_REGISTRY:-ghcr.io/theeurbanlegend}/frw-router:${FRW_TAG:-latest}
    pull_policy: always

  web:
    image: ${FRW_REGISTRY:-ghcr.io/theeurbanlegend}/frw-web:${FRW_TAG:-latest}
    pull_policy: always
