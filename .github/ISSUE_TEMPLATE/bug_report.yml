name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Agent
        - Router (self-hosted)
        - Router (hosted cloud)
        - Skill / docs
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Agent version (`agent --version`) and/or router commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, plus the MCP client you use (Claude, Cursor, ...)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Agent or router output. Remove tokens, passwords and private paths first.
      render: shell
