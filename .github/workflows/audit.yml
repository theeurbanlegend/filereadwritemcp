name: Dependency audit
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'agent/Cargo.lock'
      - 'router/yarn.lock'
      - 'web/yarn.lock'
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: agent

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [router, web]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn audit --groups dependencies --level high
