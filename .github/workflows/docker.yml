name: Docker images
on:
  push:
    branches: [main]
    paths: ["router/**", "web/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

# Builds the router and web images for the hosted deployment and pushes them to GHCR, so a
# small server can pull them (make up-prebuilt) instead of building on the box.
jobs:
  build:
    strategy:
      matrix:
        service: [router, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frw-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/frw-${{ matrix.service }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
