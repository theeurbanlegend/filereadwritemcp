version: 2
updates:
  - package-ecosystem: cargo
    directory: /agent
    schedule:
      interval: weekly
    groups:
      agent-deps:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /router
    schedule:
      interval: weekly
    groups:
      router-deps:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
