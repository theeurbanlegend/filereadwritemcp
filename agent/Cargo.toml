[package]
name = "agent"
version = "1.0.1"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
dunce = "1.0.5"
env_logger = "0.11.11"
futures-util = "0.3"
hex = "0.4.3"
log = "0.4.33"
rand = "0.10.2"
regex = "1.12.4"
rust_socketio = { version = "0.6.0", features = ["tokio", "async"] }
self-replace = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "time"] }
walkdir = "2.5.0"
